<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
     }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 5, 5);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 10);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // สร้างชุดควบคุม GUI
        const gui = new lil.GUI();

        // สร้าง Folder สำหรับควบคุมแสงไฟ
        const lightFolder = gui.addFolder('Directional Light Position');
        lightFolder.add(directionalLight.position, 'x', -20, 20, 0.5).name('Light X');
        lightFolder.add(directionalLight.position, 'y', 0, 30, 0.5).name('Light Y');
        lightFolder.add(directionalLight.position, 'z', -20, 20, 0.5).name('Light Z');
        lightFolder.add(directionalLight, 'intensity', 0, 10, 0.1).name('Intensity');
        lightFolder.open();

        // เปลี่ยนมาใช้ Environment Map สำรองที่ใช้งานได้จริง
        const exrLoader = new THREE.EXRLoader();
        exrLoader.load('./qwantani_night_puresky_1k.exr', function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture;
            scene.background = texture;
        });

        let loadedModel = null; 
        const textureLoader = new THREE.TextureLoader();
        const textureFolder = './textures/';

        const robotMaterial = new THREE.MeshStandardMaterial({
            map: textureLoader.load('Head_albedo[1].jpg'),
            normalMap: textureLoader.load('Head_normal[1].png'),
            roughnessMap: textureLoader.load('Head_roughness[1].jpg'),
            metalnessMap: textureLoader.load('Head_metallic[1].jpg'),
            aoMap: textureLoader.load('Head_AO[1].jpg'),
            metalness: 1.0,
            roughness: 0.5
        });

        
        // ตั้งค่า Encoding เฉพาะ map ที่มีอยู่จริงป้องกัน error
        if (robotMaterial.map) robotMaterial.map.encoding = THREE.sRGBEncoding;
        if (robotMaterial.roughnessMap) robotMaterial.roughnessMap.encoding = THREE.sRGBEncoding;
        if (robotMaterial.metalnessMap) robotMaterial.metalnessMap.encoding = THREE.sRGBEncoding;

        const objLoader = new THREE.OBJLoader();
        objLoader.load(
            './robot.obj',
            function (object) {
                object.traverse(function (child) {
                    if (child.isMesh) {
                        child.material = robotMaterial;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                object.scale.set(0.5, 0.5, 0.5);
                object.position.set(0, 0, 0);

                scene.add(object);
                loadedModel = object; 
                console.log('โหลดโมเดลสำเร็จ!');
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
            }
        );

        const texFloor = new THREE.TextureLoader().load('Metal052A.png');
        const matFloor = new THREE.MeshStandardMaterial({
              map: texFloor,
              metalness: 0.5,  // ปรับความความเป็นโลหะ
              roughness: 0.2,  // ปรับความหยาบ (ค่าน้อยจะยิ่งเงา)
             side: THREE.DoubleSide
            });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        scene.add(plane);

        function animate(t) {
            requestAnimationFrame(animate);

            if (loadedModel) {
                //loadedModel.rotation.y = Math.sin(t * 0.001);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
